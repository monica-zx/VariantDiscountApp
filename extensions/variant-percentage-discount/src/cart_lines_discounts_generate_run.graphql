query CartInput {
  cart {
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
        }
      }
      gpoGroup: attribute(key: "_gpo_product_group") {
        value
      }
      gpoParentGroup: attribute(key: "_gpo_parent_product_group") {
        value
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
